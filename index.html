<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>情侣抽卡</title>
  <style>
    :root {
      --ink: #241519;
      --muted: #775f66;
      --paper: #fff7ef;
      --rose: #d94d6a;
      --rose-deep: #9e2542;
      --gold: #f1b85b;
      --mint: #6fb9a3;
      --violet: #7665b8;
      --shadow: 0 22px 70px rgba(87, 28, 46, .24);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(241, 184, 91, .35), transparent 24rem),
        radial-gradient(circle at 88% 8%, rgba(111, 185, 163, .25), transparent 22rem),
        linear-gradient(135deg, #fff3e8 0%, #ffdfe7 44%, #eee9ff 100%);
      overflow-x: hidden;
    }

    .stage {
      width: min(1120px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 34px;
      align-items: center;
      padding: 28px 0;
    }

    .intro {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .mark {
      width: 92px;
      height: 92px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--rose), var(--violet));
      box-shadow: var(--shadow);
    }

    .mark svg { width: 62px; height: 62px; }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 86px);
      line-height: .95;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 650px;
      margin: 0;
      font-size: clamp(17px, 2.2vw, 23px);
      line-height: 1.65;
      color: var(--muted);
    }

    .rules {
      display: grid;
      gap: 10px;
      max-width: 650px;
      padding: 0;
      margin: 8px 0 0;
      list-style: none;
    }

    .rules li {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 10px;
      align-items: start;
      color: #513840;
      line-height: 1.55;
    }

    .dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .72);
      color: var(--rose-deep);
      font-weight: 800;
    }

    .game {
      display: grid;
      gap: 16px;
      justify-items: stretch;
    }

    .deck-wrap {
      position: relative;
      min-height: 560px;
      display: grid;
      align-items: center;
    }

    .sparkle {
      position: absolute;
      inset: 6%;
      pointer-events: none;
      opacity: .8;
    }

    .sparkle svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 8px 16px rgba(158, 37, 66, .18));
    }

    .card {
      position: relative;
      width: min(100%, 420px);
      min-height: 540px;
      margin: 0 auto;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, .86);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .58), rgba(255, 247, 239, .9)),
        var(--paper);
      box-shadow: var(--shadow);
      transform-style: preserve-3d;
      transition: transform .45s ease, opacity .35s ease;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(255, 255, 255, .45);
      border-radius: 6px;
      pointer-events: none;
      z-index: 3;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(255, 247, 239, .18) 48%, rgba(255, 247, 239, .96) 72%);
      pointer-events: none;
      z-index: 1;
    }

    .scene {
      position: relative;
      z-index: 0;
      height: 245px;
      margin: -18px -18px 14px;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 22%, rgba(255, 255, 255, .56), transparent 9rem),
        linear-gradient(140deg, #ff6d8d 0%, #8f62ce 52%, #1d234f 100%);
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, .18), transparent 36%),
        radial-gradient(circle at 76% 20%, rgba(241, 184, 91, .55), transparent 5rem);
      mix-blend-mode: screen;
    }

    .scene svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .scene-badge {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 6px 11px;
      border-radius: 999px;
      color: #fff;
      background: rgba(36, 21, 25, .42);
      backdrop-filter: blur(10px);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .scene-dinner { background: linear-gradient(145deg, #f0626f 0%, #f1b85b 48%, #333c6f 100%); }
    .scene-hug { background: linear-gradient(145deg, #ff8b7a 0%, #d94d6a 50%, #49366f 100%); }
    .scene-kiss { background: linear-gradient(145deg, #ff5d92 0%, #a72e68 46%, #2a1c49 100%); }
    .scene-night { background: linear-gradient(145deg, #172047 0%, #7665b8 52%, #d94d6a 100%); }
    .scene-reward { background: linear-gradient(145deg, #6fb9a3 0%, #f1b85b 48%, #d94d6a 100%); }
    .scene-bold { background: linear-gradient(145deg, #2a1636 0%, #9e2542 48%, #f05c6a 100%); }

    .scene .glow {
      animation: pulseGlow 2.6s ease-in-out infinite;
      transform-origin: center;
    }

    .scene .float {
      animation: floatScene 3.8s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: .72; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    @keyframes floatScene {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .card.flip {
      transform: rotateY(8deg) translateY(-6px);
      opacity: .18;
    }

    .meta {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 11px;
      border-radius: 999px;
      color: #fff;
      background: var(--rose-deep);
      white-space: nowrap;
    }

    .card h2 {
      position: relative;
      z-index: 2;
      margin: 0 0 18px;
      font-size: clamp(30px, 8vw, 48px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .card p {
      position: relative;
      z-index: 2;
      margin: 0 0 22px;
      font-size: clamp(17px, 4.2vw, 22px);
      line-height: 1.55;
      color: #4b3038;
    }

    .footer-note {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      padding-top: 18px;
      border-top: 1px solid rgba(217, 77, 106, .16);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--rose), var(--rose-deep));
      box-shadow: 0 14px 28px rgba(158, 37, 66, .24);
      transition: transform .18s ease, box-shadow .18s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); box-shadow: 0 8px 18px rgba(158, 37, 66, .2); }

    .secondary {
      color: var(--rose-deep);
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 10px 22px rgba(87, 28, 46, .12);
    }

    .panel {
      border-radius: 8px;
      padding: 14px;
      background: rgba(255, 255, 255, .5);
      border: 1px solid rgba(255, 255, 255, .66);
      backdrop-filter: blur(14px);
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
    }

    .history {
      max-height: 136px;
      overflow: auto;
      margin-top: 10px;
      display: grid;
      gap: 8px;
      color: #4d363d;
      font-size: 14px;
    }

    .history div {
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .55);
    }

    .gate {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(36, 21, 25, .42);
      backdrop-filter: blur(18px);
    }

    .gate-box {
      width: min(520px, 100%);
      border-radius: 8px;
      padding: 28px;
      background: rgba(255, 247, 239, .96);
      box-shadow: var(--shadow);
    }

    .gate-box h2 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    .gate-box p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.7;
    }

    .gate-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .hidden { display: none; }

    @media (max-width: 900px) {
      .stage {
        grid-template-columns: 1fr;
        gap: 18px;
        align-items: start;
      }

      .intro { padding-top: 10px; }
      .deck-wrap { min-height: auto; }
      .card { min-height: 470px; }
      .meta { margin-bottom: 44px; }
    }

    @media (max-width: 520px) {
      .stage { width: min(100% - 20px, 1120px); }
      .controls, .gate-actions { grid-template-columns: 1fr; }
      .card { padding: 22px; }
      .mark { width: 74px; height: 74px; border-radius: 18px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="intro" aria-label="游戏说明">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none">
          <path d="M60 101C50 88 22 72 22 43c0-14 10-25 24-25 7 0 12 3 14 8 3-5 8-8 15-8 14 0 23 11 23 25 0 29-28 45-38 58Z" fill="#fff7ef"/>
          <path d="M42 42h36M42 58h36M42 74h22" stroke="#9e2542" stroke-width="7" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>情侣抽卡</h1>
      <p class="subtitle">99 张暧昧任务卡，适合两个人在安全、清醒、愿意的状态下玩。抽到不舒服的卡可以随时跳过，今晚的规则由你们一起决定。</p>
      <ul class="rules">
        <li><span class="dot">1</span><span>抽到卡后，两个人都点头才执行；任何一方说停，就立刻停。</span></li>
        <li><span class="dot">2</span><span>可以提前约定暗号，比如“换一张”，用来重抽或暂停。</span></li>
        <li><span class="dot">3</span><span>卡片偏亲密暧昧，但默认不替任何人同意更进一步。</span></li>
      </ul>
    </section>

    <section class="game" aria-label="抽卡区">
      <div class="deck-wrap">
        <div class="sparkle" aria-hidden="true">
          <svg viewBox="0 0 420 560">
            <path d="M35 92l10 22 22 10-22 10-10 22-10-22-22-10 22-10 10-22Z" fill="#f1b85b"/>
            <path d="M365 130l8 18 18 8-18 8-8 18-8-18-18-8 18-8 8-18Z" fill="#6fb9a3"/>
            <path d="M352 438l12 27 27 12-27 12-12 27-12-27-27-12 27-12 12-27Z" fill="#d94d6a"/>
            <path d="M68 428l7 15 15 7-15 7-7 15-7-15-15-7 15-7 7-15Z" fill="#7665b8"/>
          </svg>
        </div>
        <article class="card" id="card">
          <div class="scene scene-night" id="scene" aria-hidden="true">
            <span class="scene-badge" id="sceneBadge">今晚开场</span>
          </div>
          <div class="meta">
            <span class="tag" id="tag">热身</span>
            <span id="count">00 / 99</span>
          </div>
          <h2 id="title">今晚谁先抽？</h2>
          <p id="text">点下面的“抽一张”，让第一张卡来决定你们今晚的气氛。</p>
          <div class="footer-note">
            <span>可以跳过</span>
            <span>双方同意</span>
          </div>
        </article>
      </div>

      <div class="controls">
        <button id="drawBtn" type="button">抽一张</button>
        <button class="secondary" id="resetBtn" type="button">重新洗牌</button>
      </div>

      <div class="panel">
        <div class="stats">
          <span id="left">剩余 99 张</span>
          <span id="level">模式：暧昧升温</span>
        </div>
        <div class="history" id="history" aria-label="抽卡历史"></div>
      </div>
    </section>
  </main>

  <div class="gate" id="gate">
    <div class="gate-box">
      <h2>开始前确认</h2>
      <p>这个小游戏只适合成年人情侣使用。请确认双方都已成年、清醒、自愿，并且可以随时拒绝、暂停或重抽。</p>
      <div class="gate-actions">
        <button id="enterBtn" type="button">确认，开始抽卡</button>
        <button class="secondary" id="softBtn" type="button">只玩温柔版</button>
      </div>
    </div>
  </div>

    const softTags = new Set(["热身", "奖励"]);
    let cards = [];
    let history = [];
    let softOnly = false;

    const cardEl = document.getElementById("card");
    const sceneEl = document.getElementById("scene");
    let sceneBadgeEl = document.getElementById("sceneBadge");
    const tagEl = document.getElementById("tag");
    const countEl = document.getElementById("count");
    const titleEl = document.getElementById("title");
    const textEl = document.getElementById("text");
    const leftEl = document.getElementById("left");
    const levelEl = document.getElementById("level");
    const historyEl = document.getElementById("history");

    function shuffle(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function newDeck() {
      const source = softOnly ? allCards.filter(([tag]) => softTags.has(tag)) : allCards;
      cards = shuffle(source);
      history = [];
      renderStats();
      historyEl.innerHTML = "";
      setCardVisual(["开场", "今晚谁先抽？", ""]);
      tagEl.textContent = softOnly ? "温柔" : "热身";
      countEl.textContent = `00 / ${String(source.length).padStart(2, "0")}`;
      titleEl.textContent = "今晚谁先抽？";
      textEl.textContent = softOnly ? "温柔版只保留轻松、照顾和甜蜜奖励卡。" : "点下面的“抽一张”，让第一张卡来决定你们今晚的气氛。";
    }

    function renderStats() {
      const total = softOnly ? allCards.filter(([tag]) => softTags.has(tag)).length : allCards.length;
      leftEl.textContent = `剩余 ${cards.length} 张`;
      levelEl.textContent = softOnly ? "模式：温柔版" : "模式：暧昧升温";
      countEl.textContent = `${String(history.length).padStart(2, "0")} / ${String(total).padStart(2, "0")}`;
    }

    function drawCard() {
      if (!cards.length) newDeck();
      const item = cards.pop();
      history.unshift(item);
      cardEl.classList.add("flip");
      setTimeout(() => {
        setCardVisual(item);
        tagEl.textContent = item[0];
        titleEl.textContent = item[1];
        textEl.textContent = item[2];
        cardEl.classList.remove("flip");
        renderStats();
        renderHistory();
      }, 180);
    }

    function getSceneType(item) {
      const [tag, title, text] = item;
      const words = `${tag}${title}${text}`;
      if (/请客|早餐|夜宵|投喂|倒水/.test(words)) return "dinner";
      if (/拥抱|抱|贴贴|靠肩|靠在|心跳|充电/.test(words)) return "hug";
      if (/亲|吻|嘴|脖颈|耳边|耳语|呼吸/.test(words)) return "kiss";
      if (/奖励|券|愿望|主角|小纸条|兑换|翻倍/.test(words)) return "reward";
      if (/大胆|灯光|主导|导演|挑逗|触碰|升温|继续/.test(words)) return "bold";
      return "night";
    }

    function setCardVisual(item) {
      const type = getSceneType(item);
      const labels = {
        dinner: "烛光约会",
        hug: "贴近充电",
        kiss: "心跳距离",
        night: "暧昧夜晚",
        reward: "甜蜜奖励",
        bold: "升温时刻"
      };
      sceneEl.className = `scene scene-${type}`;
      sceneBadgeEl.textContent = labels[type];
      sceneEl.innerHTML = `<span class="scene-badge" id="sceneBadge">${labels[type]}</span>${sceneSvg(type)}`;
      sceneBadgeEl = document.getElementById("sceneBadge");
    }

    function renderHistory() {
      historyEl.innerHTML = history.slice(0, 8).map((item, index) => (
        `<div>${index + 1}. ${item[1]} · ${item[0]}</div>`
      )).join("");
    }

    function enterGame() {
      softOnly = false;
      document.getElementById("gate").classList.add("hidden");
      newDeck();
    }

    function enterSoftGame() {
      softOnly = true;
      document.getElementById("gate").classList.add("hidden");
      newDeck();
    }

    function bindButton(id, handler) {
      const button = document.getElementById(id);
      let lastTap = 0;
      const run = (event) => {
        if (event) event.preventDefault();
        const now = Date.now();
        if (now - lastTap < 350) return;
        lastTap = now;
        handler();
      };
      button.addEventListener("click", run);
      button.addEventListener("touchend", run, { passive: false });
    }

    window.drawCard = drawCard;
    window.newDeck = newDeck;
    window.enterGame = enterGame;
    window.enterSoftGame = enterSoftGame;

    bindButton("drawBtn", drawCard);
    bindButton("resetBtn", newDeck);
    bindButton("enterBtn", enterGame);
    bindButton("softBtn", enterSoftGame);

    newDeck();
  </script>
